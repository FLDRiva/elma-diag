apiVersion: apps/v1
kind: Deployment
metadata:
  name: elma-diag
  namespace: elma-diag
  labels:
    app: elma-diag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elma-diag
  template:
    metadata:
      labels:
        app: elma-diag
    spec:
      containers:
      - name: elma-diag
        image: rivasr/elma-diag:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: elma-diag
  namespace: elma-diag
spec:
  selector:
    app: elma-diag
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elma-diag
  namespace: elma-diag
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: diag.riva.elewise.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: elma-diag
            port:
              number: 80
