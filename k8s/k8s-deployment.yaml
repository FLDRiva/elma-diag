apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostics-elma365-diagnostics
  namespace: elma365-diagnostics
  labels:
    app: elma365-diagnostics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elma365-diagnostics
  template:
    metadata:
      labels:
        app: elma365-diagnostics
    spec:
      containers:
      - name: diagnostics
        image: rivasr/elma365-diagnostics:1.5.4
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostics-elma365-service
  namespace: elma365-diagnostics
spec:
  selector:
    app: elma365-diagnostics
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diagnostics-elma365-ingress
  namespace: elma365-diagnostics
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - diag.riva.elewise.local
    secretName: diagnostics-tls
  rules:
  - host: diag.riva.elewise.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: diagnostics-elma365-service
            port:
              number: 80
